<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anizium Portal</title>
    <style>
        body {
            background-color: #0f0e17;
            color: #fffffe;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1f1b24;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #7f5af0;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #7f5af0;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #94a1b2;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .btn {
            background-color: #7f5af0;
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            display: block;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #6246ea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Anizium Portal</h1>
        <p>Infinity Plan & Proxy Aktif Başlatıcı</p>
        
        <!-- BURAYA master.py'den çıkan güncel Cloudflare linkini yapıştıracaksın -->
        <a href="https://survivors-surface-feels-heritage.trycloudflare.com" class="btn" id="launchBtn">🚀 Anizium'u Başlat</a>
    </div>

    <script>
        const tunnelUrl = "https://survivors-surface-feels-heritage.trycloudflare.com";
        document.getElementById("launchBtn").href = tunnelUrl;
    </script>
</body>
</html>
